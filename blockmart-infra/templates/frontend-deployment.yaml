apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockmart-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: blockmart-frontend
  template:
    metadata:
      labels:
        app: blockmart-frontend
    spec:
      containers:
      - name: frontend
        image: {{ .Values.frontend.image }}
        imagePullPolicy: Never
        ports:
        - containerPort: {{ .Values.frontend.port }}