apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockmart-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: blockmart-backend
  template:
    metadata:
      labels:
        app: blockmart-backend
    spec:
      containers:
      - name: backend
        image: {{ .Values.backend.image }}
        imagePullPolicy: Never # Forces K8s to use your local Docker image
        ports:
        - containerPort: {{ .Values.backend.port }}
        env:
        - name: DATABASE_URL
          value: {{ .Values.backend.databaseUrl }}